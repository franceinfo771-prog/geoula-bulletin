*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:radial-gradient(1200px 700px at 10% -10%, #17202b 0%, var(--bg) 55%) no-repeat, var(--bg);
  color:var(--text);font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;

.wrap{max-width:860px;margin:0 auto}
nav.retour{margin-bottom:26px}
nav.retour a{color:var(--muted);text-decoration:none;font-size:14px}
nav.retour a:hover{color:var(--accent)}
.kicker{text-transform:uppercase;letter-spacing:.16em;font-size:11px;font-weight:600;color:var(--accent);margin:0 0 10px}

.sous{margin:0 0 26px;color:var(--muted);font-size:15px}
ul.liste{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:22px 24px}
ul.liste li{margin:0 0 16px;padding-left:16px;position:relative}
ul.liste li:last-child{margin-bottom:0}
ul.liste li::before{content:"";position:absolute;left:0;top:.62em;width:5px;height:5px;border-radius:50%;background:var(--accent-2);opacity:.65}
ul.liste a{color:var(--text);text-decoration:none;font-weight:600;font-size:15.5px;border-bottom:1px solid transparent}
ul.liste a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.src{display:block;font-size:12px;color:var(--muted);margin-top:3px}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:var(--muted);text-decoration:none}
footer a:hover{color:var(--accent)}
</style>
</head>
